[env:m5stack-stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
monitor_port = COM10
upload_port = COM10
board_build.flash_mode = dio
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps =
	m5stack/M5Dial
	m5stack/M5Unified
	m5stack/M5GFX
	stm32duino/STM32duino VL53L4CD@1.0.5
	adafruit/Adafruit ADXL345@1.3.4
