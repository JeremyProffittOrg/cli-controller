name: build
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: "0"
      - name: Build
        run: go build -ldflags="-H windowsgui" -o cli-controller.exe ./cmd/cli-controller
        env:
          CGO_ENABLED: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-controller-windows
          path: cli-controller.exe
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -d firmware
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: firmware/.pio/build/*/firmware.bin
